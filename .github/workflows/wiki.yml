name: Publish wiki

# Копіює docs/wiki/*.md у GitHub Wiki. Потрібно один раз: Settings -> Features -> Wikis (увімкнути)
# і створити будь-яку першу сторінку, щоб з'явився репозиторій вікі. До того цей крок просто пропускається.
on:
  push:
    branches: [main]
    paths: ['docs/wiki/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync docs/wiki to the wiki repository
        run: |
          set -e
          if ! git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" wiki 2>/dev/null; then
            echo "Wiki repository not available yet (enable Wikis and create the first page). Skipping."
            exit 0
          fi
          rm -f wiki/*.md
          cp docs/wiki/*.md wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No wiki changes."
            exit 0
          fi
          git commit -m "Sync wiki from docs/wiki ($GITHUB_SHA)"
          git push
