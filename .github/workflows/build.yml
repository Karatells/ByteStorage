name: Build mod jar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Collect jars
        run: |
          mkdir -p dist
          for f in build/libs/*.jar scripting/build/libs/*.jar; do
            [ -f "$f" ] || continue
            case "$f" in
              *-sources.jar|*-javadoc.jar) continue ;;
            esac
            cp "$f" "dist/$(basename "${f%.jar}")-dev.jar"
          done
          if [ -f build/reobfJar/output.jar ]; then
            ver=$(grep -oP "^version\s*=\s*'\K[^']+" build.gradle)
            cp build/reobfJar/output.jar "dist/simple_bytestorage-${ver}.jar"
          fi
          if [ -f scripting/build/reobfJar/output.jar ]; then
            ver=$(grep -oP "^version\s*=\s*'\K[^']+" scripting/build.gradle)
            cp scripting/build/reobfJar/output.jar "dist/simple_bytestorage_scripting-${ver}.jar"
          fi
          ls -la dist

      # Каждый jar — отдельным артефактом
      - name: Upload core mod jar (reobf, for the game)
        uses: actions/upload-artifact@v4
        with:
          name: simple_bytestorage-mod-jar
          path: dist/simple_bytestorage-*[0-9].jar
          if-no-files-found: warn

      - name: Upload scripting addon jar (optional addon)
        uses: actions/upload-artifact@v4
        with:
          name: simple_bytestorage_scripting-addon-jar
          path: dist/simple_bytestorage_scripting-*[0-9].jar
          if-no-files-found: warn

      - name: Upload dev jars
        uses: actions/upload-artifact@v4
        with:
          name: simple_bytestorage-dev-jars
          path: dist/*-dev.jar
          if-no-files-found: warn

      # Сырые .jar (без zip) — во вкладке Releases
      - name: Publish release with raw jars
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: dist/*.jar
