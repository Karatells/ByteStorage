name: Release

# Реліз створюється ТІЛЬКИ вручну: Actions -> Release -> Run workflow (обери гілку), або пуш тегу vX.Y.Z.y
# Збирає обидва jar і публікує GitHub Release з нотатками з docs/RELEASE_NOTES_<версія>.md (або автогенерованими)
on:
  push:
    tags: ['v*']
  # Або вручну: Actions -> Release -> Run workflow (тег vX.Y.Z буде створено автоматично)
  workflow_dispatch:

permissions:
  contents: write

env:
  # CurseForge: секрет CURSEFORGE_TOKEN и переменная репозитория CURSEFORGE_PROJECT_ID (Settings -> Secrets and variables -> Actions).
  # Если они не заданы, публикация на CurseForge просто пропускается.
  CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
  CF_PROJECT: ${{ vars.CURSEFORGE_PROJECT_ID }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Check tag matches version
        run: |
          core=$(grep -oP "^version\s*=\s*'\K[^']+" build.gradle)
          addon=$(grep -oP "^version\s*=\s*'\K[^']+" scripting/build.gradle)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tag="${GITHUB_REF_NAME#v}"; else tag="$core"; fi
          echo "tag=$tag core=$core addon=$addon"
          [ "$tag" = "$core" ] && [ "$tag" = "$addon" ] || { echo "Tag and build.gradle versions differ"; exit 1; }
          echo "VERSION=$tag" >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Collect release jars
        run: |
          mkdir -p dist
          cp build/reobfJar/output.jar "dist/simple_bytestorage-${VERSION}.jar"
          cp scripting/build/reobfJar/output.jar "dist/simple_bytestorage_scripting-${VERSION}.jar"
          ls -la dist

      - name: Release notes
        run: |
          f="docs/RELEASE_NOTES_${VERSION}.md"
          if [ -f "$f" ]; then cp "$f" release_notes.md; else echo "Simple Byte Storage ${VERSION}" > release_notes.md; fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Simple Byte Storage ${{ env.VERSION }}
          body_path: release_notes.md
          generate_release_notes: true
          files: dist/*.jar
          fail_on_unmatched_files: true
          make_latest: true

      # Один проект CurseForge: основной мод и аддон загружаются как два файла этого проекта
      - name: Publish main mod to CurseForge
        if: ${{ env.CF_TOKEN != '' && env.CF_PROJECT != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ env.CF_PROJECT }}
          curseforge-token: ${{ env.CF_TOKEN }}
          files: dist/simple_bytestorage-${{ env.VERSION }}.jar
          name: Simple Byte Storage ${{ env.VERSION }}
          version: ${{ env.VERSION }}
          version-type: release
          changelog-file: release_notes.md
          loaders: forge
          game-versions: 1.20.1
          java: 17

      - name: Publish Scripting addon to CurseForge
        if: ${{ env.CF_TOKEN != '' && env.CF_PROJECT != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ env.CF_PROJECT }}
          curseforge-token: ${{ env.CF_TOKEN }}
          files: dist/simple_bytestorage_scripting-${{ env.VERSION }}.jar
          name: Simple Byte Storage: Scripting ${{ env.VERSION }}
          version: ${{ env.VERSION }}
          version-type: release
          changelog-file: release_notes.md
          loaders: forge
          game-versions: 1.20.1
          java: 17
