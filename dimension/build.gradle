plugins {
    id 'java'
    id 'net.minecraftforge.gradle'
}

group = 'com.simpleae'
version = '1.4.0.40'
archivesBaseName = 'simple_bytestorage_dimension'

evaluationDependsOn(':')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'

    // Основной мод — только для компиляции (в игре это отдельная мод-зависимость)
    compileOnly project(':').sourceSets.main.output

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes([
            "Specification-Title"     : "simple_bytestorage_dimension",
            "Specification-Vendor"    : "Simple Byte Storage",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.jar.archiveVersion,
            "Implementation-Vendor"   : "Simple Byte Storage"
        ])
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/MANIFEST.MF.orig'
    finalizedBy 'reobfJar'
}
