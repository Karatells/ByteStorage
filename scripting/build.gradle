plugins {
    id 'java'
    id 'net.minecraftforge.gradle'
}

group = 'com.simpleae'
// Версія аддона: <основна>.<мінорна>.<патч>.<збірка>, напр. 1.0.1.1
// Четверта цифра — номер збірки: збільшуйте її ПЕРЕД кожним пушем (та синхронно в mods.toml).
version = '1.0.1.2'
archivesBaseName = 'simple_bytestorage_scripting'

evaluationDependsOn(':')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
}

configurations {
    // Rhino вкладається ЛИШЕ в jar аддона (основний мод його не містить)
    shade
    compileOnly.extendsFrom shade
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'

    // Основний мод — лише для компіляції (у грі це окремий мод-залежність)
    compileOnly project(':').sourceSets.main.output

    shade 'org.mozilla:rhino:1.7.15'
}

jar {
    manifest {
        attributes([
            "Specification-Title"     : "simple_bytestorage_scripting",
            "Specification-Vendor"    : "Simple Byte Storage",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.jar.archiveVersion,
            "Implementation-Vendor"   : "Simple Byte Storage"
        ])
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.shade.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/MANIFEST.MF.orig'
    finalizedBy 'reobfJar'
}
