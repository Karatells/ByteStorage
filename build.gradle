plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

group = 'com.simpleae'
// Версія: <основна>.<мінорна>.<патч>.<збірка>. Четверта цифра — НАСКРІЗНИЙ номер збірки: ніколи не скидається
// (після релізу 1.1.4 перша збірка — 1.1.4.<попередня збірка + 1>, напр. 1.1.4.10). Збільшуйте її ПЕРЕД кожним пушем (і в mods.toml).
version = '1.2.1.31'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://dvs1.progwml6.com/files/maven/' } // JEI
    maven { url = 'https://modmaven.dev' }                   // JEI (дзеркало)
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'

    // JEI — лише API для компіляції (інтеграція необов'язкова: без JEI мод працює)
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-common-api:15.20.0.106')
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-forge-api:15.20.0.106')

    // Автотести чистой логики и ресурсов (без запуска игры) — см. src/test
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
    testImplementation 'com.google.code.gson:gson:2.10.1'
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes([
            "Specification-Title"     : "simple_bytestorage",
            "Specification-Vendor"    : "Simple Byte Storage",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.jar.archiveVersion,
            "Implementation-Vendor"   : "Simple Byte Storage",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}
